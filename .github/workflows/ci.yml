name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read   # minimum needed for actions/checkout on all jobs

jobs:
  # Build & Test — runs on every push and PR
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history to derive the version from git tags

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: ./build.sh --target=Build

      - name: Test
        run: dotnet test tests/FuseraftCli.Tests/FuseraftCli.Tests.csproj --nologo --logger "console;verbosity=normal"

  # Publish — self-contained single-file binaries for each platform.
  # Runs on push to main and on tag pushes (not on PRs).
  # Cross-compiled from a single ubuntu-latest runner.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar
          - rid: linux-arm64
            archive: tar
          - rid: win-x64
            archive: zip
          - rid: osx-x64
            archive: tar
          - rid: osx-arm64
            archive: tar

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history to derive the version from git tags

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        run: |
          # On a tag push github.ref_name is the tag (e.g. v1.2.3); strip the leading 'v'.
          # On a branch push, derive a pre-release label from git describe.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(git describe --tags --long --abbrev=7 2>/dev/null \
              | sed -E 's/^v//; s/-([0-9]+)-g([0-9a-f]+)$/-alpha.\1+g\2/' \
              || echo "0.0.0-dev+g$(git rev-parse --short HEAD)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Publish is delegated to build.cake — it's the single source of truth for what
      # ships in a release (e.g. bundling fuseraft-update.exe alongside fuseraft.exe on
      # Windows). Tests already ran in the build job, so skip re-running them per RID.
      - name: Publish via build.cake
        run: ./build.sh --target=Publish --runtime=${{ matrix.rid }} --skipTests=true

      - name: Archive (tar)
        if: matrix.archive == 'tar'
        run: |
          tar -czf fuseraft-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz \
            -C bin fuseraft

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd bin
          zip ../fuseraft-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip fuseraft.exe fuseraft-update.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fuseraft-${{ matrix.rid }}
          path: fuseraft-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.*
          retention-days: 30

  # Release — creates a GitHub release with all platform binaries.
  # Triggered only on v* tag pushes (e.g. v1.2.0).
  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
