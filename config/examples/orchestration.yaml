## Software development team: Planner scopes, Developer implements, Tester verifies,
## Reviewer approves. Every handoff is gated on real evidence on disk.
## Run:      fuseraft run --config config/examples/orchestration.yaml "Your task"
## Validate: fuseraft validate config/examples/orchestration.yaml

team: SoftwareDevelopmentTeam
description: Four-agent pipeline with evidence-gated handoffs.

models:
  fast:
    modelId: grok-4.3
    endpoint: https://api.x.ai/v1
    apiKeyEnvVar: XAI_API_KEY
    reasoningEffort: none
  reasoning:
    modelId: grok-4.3
    endpoint: https://api.x.ai/v1
    apiKeyEnvVar: XAI_API_KEY
    reasoningEffort: low

artifacts:
  brief:
    path: .fuseraft/artifacts/brief.json
    shape:
      goal: string
      files_to_change: [string]
      acceptance_criteria: [string]
      constraints: [string]
      verify_command: string
  testResults:
    path: .fuseraft/artifacts/test-report.json
    shape:
      results:
        - criterion: string
          status: PASS|FAIL
          command: string
          exit_code: int

agents:
  Planner:
    role: Reads the task and codebase and writes a focused brief.
    model: fast
    tools: [FileSystem, Search, Scratchpad, Subagent]
    writes: [brief]
    instructions: |
      You are a technical project planner.

      1. Read the task and identify what is being asked.
      2. Explore: use subagent_locate for targeted lookups and subagent_explore for
         broad questions. Use read_file for one or two specific files.
      3. Write the brief. List only files that must change. Every acceptance
         criterion must be testable, and verify_command must build and test the
         change on this project.

  Developer:
    role: Implements the brief.
    model: fast
    tools: [FileSystem, Shell, Git, Search, Changes]
    reads: [brief]
    instructions: |
      You are an expert software developer.

      1. Implement every path in the brief's files_to_change with write_file.
      2. Run the brief's verify_command with shell_run and include the exact output.
      3. Load the git-commit skill and follow it to commit.
    advanced:
      functionChoice: required
      maxInTurnToolPairs: 12

  Tester:
    role: Runs the tests and reports a result per acceptance criterion.
    model: fast
    tools: [FileSystem, Shell, Changes]
    reads: [brief]
    writes: [testResults]
    instructions: |
      You are a quality assurance engineer.

      1. Call changes_read_latest to see what the Developer wrote.
      2. Run the project's test suite with shell_run and paste the exact output.
      3. Map each acceptance criterion to PASS or FAIL, recording the exact command
         and exit code. A PASS with no command is treated as fabricated.
    advanced:
      functionChoice: required
      maxInTurnToolPairs: 12

  Reviewer:
    role: Approves the work or sends it back.
    model: reasoning
    tools: [FileSystem, Shell, Changes]
    reads: [brief, testResults]
    instructions: |
      You are a senior tech lead performing a final code review.

      1. Call changes_read to see what was actually done this session.
      2. Read the changed files and check quality, correctness and fit with the brief.
      3. Spot-check at least one acceptance criterion yourself with shell_run.
    advanced:
      contextWindow:
        textOnly: true

  Verifier:
    role: Checks agents' claims against the recorded change log.
    model: fast
    tools: [Changes]
    sees: fork
    instructions: |
      You are an evidence auditor. Detect inconsistencies between what agents claim
      and what is recorded in the change log.

      1. Call changes_read_latest to see what was actually done this session.
      2. Compare recorded file writes, shell commands and exit codes against the
         claims in recent messages.
      3. If consistent, reply "Evidence verified — no inconsistencies found."
         If not, reply "INCONSISTENCY DETECTED: <claimed vs recorded>".
    advanced:
      functionChoice: required

flow:
  start: Planner
  steps:
    Planner:
      - to: Developer
        requires: [brief]
    Developer:
      - to: Tester
        requires:
          - commandSucceeded: brief.verify_command
            fallback: build|compile|test|check
      - to: Planner
        when: the plan needs rethinking
    Tester:
      - to: Reviewer
        when: every criterion passes
        requires:
          - testReport: testResults
        onStuck: Developer
      - to: Developer
        when: a criterion fails
    Reviewer:
      - to: end
        when: every criterion is verified
      - to: Developer
        when: the code or tests need fixing
      - to: Planner
        when: the plan is fundamentally wrong

limits:
  maxTurns: 40

advanced:
  verifier:
    agentName: Verifier
    everyNTurns: 5
    triggerOnSuspiciousTransition: true
    findingsKeyword: INCONSISTENCY
  compaction:
    triggerTurnCount: 25
    keepRecentTurns: 10
    mode: lossless
  failureHandling:
    missingEvidence: { action: Reinstruct, threshold: 3 }
    conflictingEvidence: { action: Reinstruct, threshold: 2 }
    noProgress: { action: Abort, threshold: 3 }
