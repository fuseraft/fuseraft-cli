## Three-agent review loop: Writer drafts, Editor reviews, Publisher saves.
## The draft and the review are artifacts with declared shapes, so a handoff is
## blocked until the file exists and parses into the expected fields.
##
## Run:      fuseraft run --config config/examples/article-review-pipeline.yaml "Your task"
## Validate: fuseraft validate config/examples/article-review-pipeline.yaml

team: ArticleReviewPipeline
description: Writer drafts an article, Editor approves or sends it back, Publisher saves it.

models:
  grok:
    modelId: grok-4.3
    endpoint: https://api.x.ai/v1
    apiKeyEnvVar: XAI_API_KEY
    reasoningEffort: none

artifacts:
  draft:
    path: .fuseraft/artifacts/draft.json
    shape:
      title: string
      content: string
      word_count: int
  review:
    path: .fuseraft/artifacts/review.json
    shape:
      verdict: approved|revision_needed
      feedback: string

agents:
  Writer:
    role: Drafts or revises the article.
    model: grok
    tools: [FileSystem]
    reads: [review]
    writes: [draft]
    instructions: |
      You are a technical writer. Draft a well-structured article for the user's task.

      If a review exists with verdict revision_needed, revise the draft to address every
      point in its feedback, and don't repeat content that was rejected.

      The content must be at least 200 words.

  Editor:
    role: Approves the draft or asks for a revision.
    model: grok
    tools: [FileSystem]
    reads: [draft]
    writes: [review]
    instructions: |
      You are a senior editor. Evaluate the draft:

      1. Length: word_count is at least 200.
      2. Title: descriptive and relevant to the content.
      3. Structure: at least two distinct sections or paragraphs.
      4. Clarity: no unexplained jargon; key terms are defined.
      5. Completeness: the article fully addresses the user's task.

      Write the review. In feedback, name each issue and exactly what the Writer must change.
      Never approve a draft shorter than 200 words.

  Publisher:
    role: Saves the approved article as Markdown.
    model: grok
    tools: [FileSystem]
    reads: [draft]
    instructions: |
      You are a content publisher. The draft has been approved.

      1. Write output/article.md: "# <title>", a blank line, then the content with
         blank lines between paragraphs.
      2. Read the file back to confirm it matches the approved content verbatim.

flow:
  start: Writer
  steps:
    Writer:
      - to: Editor
        requires: [draft]
    Editor:
      - to: Publisher
        when: the verdict is approved
        requires: [review]
      - to: Writer
        when: the verdict is revision_needed
        requires: [review]
    Publisher:
      - to: end
        requires:
          - fileExists: output/article.md

limits:
  maxTurns: 12

advanced:
  compaction:
    triggerTurnCount: 20
    keepRecentTurns: 6
