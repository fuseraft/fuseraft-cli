## Production MCP HTTP example: a single agent backed by a remote/hosted MCP server that
## requires authentication, using each of the two auth styles fuseraft-cli supports.
## Prerequisites:
##   1. Ensure XAI_API_KEY is set in your environment (for the agent's model).
##   2. Pick ONE of the two McpServers options below; option B is commented out. Set whatever env var your chosen entry references.
## Run:      fuseraft run --config config/examples/production-mcp-http.yaml "List the available tools"
## Validate: fuseraft validate config/examples/production-mcp-http.yaml

team: ProductionMcpHttpExample
description: "Single-agent setup that connects to a remote MCP server over HTTP with authentication — demonstrates a static bearer-token header and, separately, OAuth 2.1 login."

agents:
  ToolAgent:
    role: Uses tools exposed by the remote MCP server.
    model:
      modelId: grok-4.3
      endpoint: https://api.x.ai/v1
      apiKeyEnvVar: XAI_API_KEY
      maxTokens: 4096
    tools: [RemoteTools]
    sees: conversation
    instructions: |
      You have access to tools from a remote MCP server via the RemoteTools plugin.
      Use them to complete the user's request. Be concise about what you did and observed.

flow:
  start: ToolAgent
  steps:
    ToolAgent:
      - to: end
        when: the work is complete

limits:
  maxTurns: 10

mcpServers:
  # Option A: static header auth (API key or bearer token). ${ENV_VAR} tokens in Url and
  # Headers are expanded at connect time, so the secret never lives in this file;
  # `fuseraft validate` warns if the referenced env var isn't set.
  - name: RemoteTools
    transport: http
    url: https://mcp.example.com/mcp
    transportMode: streamable-http   # pin this if the server doesn't support auto-detect
    headers:
      Authorization: "Bearer ${REMOTE_MCP_TOKEN}"

  # Option B: OAuth 2.1 login. The first connection opens your browser to authorize; tokens
  # are cached in your OS keychain so later sessions reconnect silently. Most fields are
  # optional; dynamic client registration handles the rest.
  # - Name: RemoteTools
  #   Transport: http
  #   Url: https://mcp.example.com/mcp
  #   OAuth: {}
