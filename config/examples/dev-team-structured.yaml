## Dev-team pipeline with state machine routing, evidence contracts, and a Verifier.
## The Reviewer emits a structured JSON verdict block then signals APPROVED,
## REVISION REQUIRED, or REPLAN REQUIRED — each routes to a different state.
##
## Run:      fuseraft run --config config/examples/dev-team-structured.yaml
## Validate: fuseraft validate config/examples/dev-team-structured.yaml

Orchestration:
  Name: SoftwareDevelopmentTeamStructured
  Description: >-
    Four-agent pipeline (Planner → Developer → Tester → Reviewer) with state machine
    routing, evidence contracts, failure handling, and self-verification. The Reviewer
    emits a structured JSON verdict block before signalling the outcome.

  Models:
    fast:
      ModelId: grok-4.3
      Endpoint: https://api.x.ai/v1
      ApiKeyEnvVar: XAI_API_KEY
      ReasoningEffort: none
    reasoning:
      ModelId: grok-4.3
      Endpoint: https://api.x.ai/v1
      ApiKeyEnvVar: XAI_API_KEY
      ReasoningEffort: low

  EvidenceStore:
    Path: .fuseraft/state/evidence.json

  ChangeTracking:
    Path: .fuseraft/state/changes.json

  Validation:
    BriefPath: .fuseraft/artifacts/brief.json
    TestReportPath: .fuseraft/artifacts/test-report.json
    ChangeLogPath: .fuseraft/state/changes.json
    TestAssertionPatterns:
      - "tester::assert"
      - "if .+ throw"
      - "\\bassert\\b"
      - "\\bexpect\\b"

  Contracts:
    - Name: BriefExists
      Requires:
        - Type: FileExists
          Path: .fuseraft/artifacts/brief.json

    - Name: ImplementationComplete
      Requires:
        - Type: FilesWritten
          Source: .fuseraft/artifacts/brief.json
          Field: files_to_change
        - Type: CommandSucceeded
          PatternField: verify_command
          Pattern: "build|compile|test|check"

    - Name: TestsValid
      Requires:
        - Type: FileExists
          Path: .fuseraft/artifacts/test-report.json
        - Type: TestReport
          NoFailures: true
          HasAssertions: true

  FailureHandling:
    MissingEvidence:
      Action: Reinstruct
      Threshold: 3
    ConflictingEvidence:
      Action: Reinstruct
      Threshold: 2
    NoProgress:
      Action: Abort
      Threshold: 3

  Verifier:
    AgentName: Verifier
    EveryNTurns: 5
    TriggerOnSuspiciousTransition: true
    FindingsKeyword: INCONSISTENCY

  Compaction:
    TriggerTurnCount: 25
    KeepRecentTurns: 10
    Mode: lossless

  Agents:
    - Name: Planner
      Description: Session planner who reads the task and codebase to produce a focused brief.
      Instructions: |
        You are a technical project planner.

        AT SESSION START: Call scratchpad_read_all to restore notes from prior sessions.

        FOLLOW THESE STEPS IN ORDER:

        1. READ THE TASK: Extract the goal, constraints, and acceptance criteria.

        2. EXPLORE: Use sub_agent_locate for targeted lookups (symbol definitions, which file declares X). Use sub_agent_explore for broad questions (format="file_list" to get a path list). Use list_files and read_file for targeted reads of 1–2 specific files.

        3. IF RETURNING FROM REVIEW (Reviewer feedback in context): Summarize the
           feedback and prepend it to the brief so the Developer addresses it directly.

        4. WRITE THE BRIEF:
           - Goal: one sentence
           - Files to change: list of paths (strings only)
           - Acceptance criteria: specific, testable bullet points
           - Constraints: anything to avoid or preserve
           Always include: "Test files contain real assertions that can fail."

        5. WRITE BRIEF TO DISK: Call write_file → .fuseraft/artifacts/brief.json:
             {
               "goal": "<one sentence>",
               "files_to_change": ["src/a.go", "src/b.go"],
               "acceptance_criteria": ["<criterion>"],
               "constraints": ["<constraint>"]
             }

        6. SAVE TO SCRATCHPAD: Call scratchpad_write with key 'session_brief'.

        7. HAND OFF: Call handoff(route_keyword: "HANDOFF TO DEVELOPER").

        RULES: Keep brief under 30 lines. Use real file paths. Do not write code.
      Model:
        ModelId: fast
        MaxTokens: 4096
      Plugins:
        - FileSystem
        - Search
        - Scratchpad
        - SubAgent
        - Handoff

    - Name: Developer
      Description: Senior software engineer who implements features using tools.
      Instructions: |
        You are an expert software developer.

        FOLLOW THESE STEPS IN ORDER:

        1. READ THE BRIEF FROM DISK: Call read_file on .fuseraft/artifacts/brief.json.
           If returning from a Reviewer rejection, the feedback field is your fix target.

        2. IMPLEMENT: Use write_file for every file in files_to_change. Never output a diff.

        3. BUILD/RUN: Use shell_run. Include exact output. At least one passing shell_run
           is required before handoff — this is enforced by contract.

        4. COMMIT: Use git_add and git_commit.

        5. HAND OFF: Call handoff(route_keyword: "HANDOFF TO TESTER") in your final response.
           If the plan needs rethinking, call handoff(route_keyword: "REPLAN REQUIRED").

        RULES:
        - Never describe a change without making it with write_file.
        - Never claim success without real tool output.
        - Never write fake tests (no assertion = not a test).
      Model:
        ModelId: fast
        MaxTokens: 16384
      FunctionChoice: required
      MaxInTurnToolPairs: 12
      Plugins:
        - FileSystem
        - Shell
        - Git
        - Search
        - Changes
        - Handoff

    - Name: Tester
      Description: QA engineer who verifies changes with real tool calls.
      Instructions: |
        You are an expert QA engineer. Verify everything independently.

        ANTI-HALLUCINATION RULE: Every shell output block must come from a shell_run
        call you actually made this turn. Never write expected output.

        FOLLOW THESE STEPS IN ORDER:

        1. READ THE BRIEF FROM DISK: Call read_file on .fuseraft/artifacts/brief.json.
        2. CHECK THE CHANGE LOG: Call changes_read_latest.
        3. AUDIT TEST CODE: A test file is only valid if it contains assertion logic
           that can actually FAIL. Print-only files are not tests — BUGS FOUND immediately.
        4. RUN TESTS: Paste exact stdout/stderr. Any failure = FAIL.
        5. TEST EACH ACCEPTANCE CRITERION with shell_run. Record PASS or FAIL.

        6a. ALL PASS: Write test report to .fuseraft/artifacts/test-report.json:
              {
                "results": [
                  {
                    "criterion": "<exact text from brief.json>",
                    "status": "PASS",
                    "command": "<exact shell_run command>",
                    "exit_code": 0
                  }
                ],
                "fake_test_files": []
              }
            Then call handoff(route_keyword: "HANDOFF TO REVIEWER").

        6b. ANY FAIL: Call handoff(route_keyword: "BUGS FOUND") and list every failure.

        RULES:
        - Never call HANDOFF TO REVIEWER before writing .fuseraft/artifacts/test-report.json.
        - Never fabricate shell output.
        - A PASS result with an empty or missing command field is treated as fabricated and will block handoff.
      Model:
        ModelId: reasoning
        MaxTokens: 16384
      FunctionChoice: required
      MaxInTurnToolPairs: 12
      Plugins:
        - FileSystem
        - Shell
        - Search
        - Changes
        - Handoff

    - Name: Reviewer
      Description: Tech lead who approves only after reading code, running a spot-check, and confirming all criteria pass.
      Instructions: |
        You are a senior tech lead performing a final review.

        AT SESSION START: Call scratchpad_read_all to restore project conventions.

        FOLLOW THESE STEPS IN ORDER:

        1. READ THE CHANGE LOG: Call changes_read.
        2. READ THE CODE: Use read_file on every changed file.
        3. REVIEW: Correctness, consistency, error handling, edge cases, security.
        3b. AUDIT TESTS: Can each test actually fail if the feature is broken?
        4. SPOT-CHECK: Run the most critical acceptance criterion with shell_run.
        5. READ THE TEST REPORT: Call read_file on .fuseraft/artifacts/test-report.json.

        6. EMIT A STRUCTURED VERDICT inside a ```json code fence:

        ```json
        {
          "verdict": "<approved | revision_required | replan_required>",
          "review": [
            {
              "criterion": "<exact text from brief.json>",
              "verdict": "PASS",
              "evidence": "<command or file — 8 words max>"
            }
          ],
          "feedback": "<actionable detail — required when verdict is not approved>"
        }
        ```

        7. SIGNAL — immediately after the closing ```:
           - verdict "approved"         → call handoff(route_keyword: "APPROVED").
                                          Call scratchpad_write to record conventions.
           - verdict "revision_required" → call handoff(route_keyword: "REVISION REQUIRED").
           - verdict "replan_required"   → call handoff(route_keyword: "REPLAN REQUIRED").

        RULES:
        - Steps 4 (shell_run) and 7 (handoff) must appear in the SAME response.
        - Never approve without a passing shell_run.
      Model:
        ModelId: fast
        MaxTokens: 32768
      Plugins:
        - FileSystem
        - Shell
        - Search
        - Changes
        - Scratchpad
        - Handoff
      ContextWindow:
        TextOnly: true

    - Name: Verifier
      Description: Evidence auditor who checks for inconsistencies between claims and recorded actions.
      Instructions: |
        You are an evidence auditor. Detect inconsistencies between what agents claim
        and what is recorded in the change log.

        1. Call changes_read_latest to see what was actually done this session.
        2. Compare recorded file writes, shell commands, and exit codes against any
           claims made in recent conversation messages.
        3. If consistent: "Evidence verified — no inconsistencies found."
        4. If inconsistent: "INCONSISTENCY DETECTED: <what was claimed vs what the evidence shows>"
      Model:
        ModelId: fast
        MaxTokens: 2048
      Plugins:
        - Changes
      FunctionChoice: required

  Selection:
    Type: statemachine
    StateMachine:
      Initial: Planning

      States:
        Planning:
          Agent: Planner
          Transitions:
            - To: Implementation
              Signal: "HANDOFF TO DEVELOPER"
              Contract: BriefExists

        Implementation:
          Agent: Developer
          Transitions:
            - To: Testing
              Signal: "HANDOFF TO TESTER"
              Contract: ImplementationComplete
            - To: Planning
              Signal: "REPLAN REQUIRED"

        Testing:
          Agent: Tester
          Transitions:
            - To: Review
              Signal: "HANDOFF TO REVIEWER"
              Contract: TestsValid
              RecoveryAgent: Developer  # invoked after 2 consecutive TestsValid failures — fixes bugs or bad test setup
            - To: Implementation
              Signal: "BUGS FOUND"

        Review:
          Agent: Reviewer
          Transitions:
            - To: Done
              Signal: APPROVED
            - To: Implementation
              Signal: "REVISION REQUIRED"
            - To: Planning
              Signal: "REPLAN REQUIRED"

        Done:
          Agent: Reviewer
          Terminal: true

  Termination:
    Type: composite
    MaxIterations: 40
    Strategies:
      - Type: regex
        Pattern: "(?m)^\\s*APPROVED\\s*$"
        AgentNames:
          - Reviewer

  Chatroom:
    Path: .fuseraft/comms/chatroom.jsonl

  Events:
    Path: .fuseraft/events.jsonl
