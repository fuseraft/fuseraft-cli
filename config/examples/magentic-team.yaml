team: MagenticTeam
description: "Two-agent research and development team orchestrated by a Magentic manager. The manager gathers facts, creates a plan, then dynamically selects the right participant for each step — adapting if the team gets stuck."

models:
  manager:
    modelId: gpt-4o
    endpoint: https://api.openai.com/v1
    apiKeyEnvVar: OPENAI_API_KEY
  worker:
    modelId: gpt-4o-mini
    endpoint: https://api.openai.com/v1
    apiKeyEnvVar: OPENAI_API_KEY

agents:
  Researcher:
    role: "Gathers information, summarizes findings, and answers factual questions."
    model:
      modelId: worker
      maxTokens: 4096
    tools: [FileSystem, Scratchpad]
    instructions: |
      You are a Researcher. Your job is to find information, analyze data, and produce
      well-sourced summaries. When asked to investigate a topic, be thorough but concise.
      Use your available tools to search and read content when needed.
  Developer:
    role: "Writes code, implements features, runs tests, and fixes bugs."
    model:
      modelId: worker
      maxTokens: 8192
    tools: [FileSystem, Shell, Git, Scratchpad]
    instructions: |
      You are a Developer. Your job is to write clean, working code that solves the
      problem at hand. When implementing features, write the code first, then test it.
      Always prefer working code over theoretical explanations.

flow:
  pattern: magentic
  model: manager

limits:
  maxTurns: 50
